    <!-- Biblioteca para exportar a div como imagem PNG -->

    <style>
@font-face {
    font-family: 'MonsterFont'; /* Esse é o apelido que você vai usar nas classes */
    src: url('MONSTER OF FANTASY.otf') format('opentype');
}
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        select, button {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background-color: #45a049;
        }

        /* --- PALCO DA CARTA --- */
        #card-container {
            position: relative;
            width: 750px;
            height: 1050px;
            background-image: url('Background.png');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Área da Arte do Monstro */
        .monster-art {
            position: absolute;
            top: 90px;       /* Ajuste conforme o seu template */
            left: 22px;     /* Ajuste conforme o seu template */
            width: 710px;    /* Largura fixa da área */
            height: 570px;   /* Altura fixa da área */
            object-fit: cover; /* Cobre o espaço sem distorcer as proporções */
            z-index: 1;
        }
		

        /* Nome do Monstro */
        .card-name {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: #2c2c2c;
            text-transform: uppercase;
            z-index: 3;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.7);
			font-family: 'MonsterFont', sans-serif;
        }

        /* Estilo base para os campos numéricos */
        .stat-value {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            color: #ffffff;
            z-index: 3;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.8);
            text-align: center;
            width: 40px;
			font-family: 'MonsterFont', sans-serif;
        }
    </style>
</head>

    const selectElement = document.getElementById('monsterSelect');

    function init() {
        if (!monstersData || monstersData.length === 0) {
            alert('A base de dados está vazia.');
            return;
        }

        monstersData.forEach((monster, index) => {
            let option = document.createElement('option');
            option.value = index;
            option.textContent = monster.Monster || `Monstro ${index + 1}`;
            selectElement.appendChild(option);
        });

        updateCard();
    }

    function updateCard() {
        const index = selectElement.value;
        const data = monstersData[index];
        if (!data) return;

        let monsterName = data.Monster;

        document.getElementById('lblName').textContent = monsterName || '';
        document.getElementById('lblHP').textContent = data.HP ?? 0;
        document.getElementById('lblAT').textContent = data.AT ?? 0;
        document.getElementById('lblDF').textContent = data.DF ?? 0;
        document.getElementById('lblAG').textContent = data.AG ?? 0;
        document.getElementById('lblMV').textContent = data.MV ?? 0;

        const imgPath = `imagens/${monsterName}.png`;
        document.getElementById('monsterImage').src = imgPath;
    }

    function exportCard() {
        const data = monstersData[selectElement.value];
        if (!data) return;
        let monsterName = data.Monster;

        const cardElement = document.getElementById('card-container');
        
        html2canvas(cardElement, { 
            scale: 2, 
            useCORS: true, 
            allowTaint: true 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `${monsterName}_card.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }).catch(err => {
            console.error("Erro ao gerar imagem:", err);
            alert("Erro ao exportar a imagem. Certifique-se de estar rodando o arquivo através de um servidor local (como a extensão Live Server do VS Code) para evitar bloqueios de segurança do navegador.");
        });
    }

    init();
</script>
